];
const board=document.getElementById("board"),svg=document.getElementById("links");
const shell=n=>`<svg viewBox="0 0 100 96" class="shell"><path d="M38 84h24l-4 9H42z" fill="var(--c)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M50 6C22 6 4 30 6 62c2 10 10 16 20 18h48c10-2 18-8 20-18C96 30 78 6 50 6Z" fill="var(--c)" stroke="#fff" stroke-width="3.5"/><path d="M50 80L12 42M50 80L27 22M50 80V9M50 80L73 22M50 80L88 42" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round"/><text x="50" y="62">${n}</text></svg>`;
let paths="",dots="";
S.forEach((s,i)=>{
 paths+=`<path class="br" style="--branch:${s.c}" d="${s.br}"/><path class="brd" d="${s.br}"/>`;
 s.it.forEach((t,j)=>{
  let tx,ty,sx,sy,ex,ey,d;
  if(s.side==="d"){tx=s.xs[j];ty=s.ty;sx=s.x;sy=s.y+45;ex=tx;ey=ty;const m=(sy+ey)/2;d=`M${sx} ${sy}C${sx} ${m} ${ex} ${m} ${ex} ${ey}`}
  else{tx=s.cx;ty=s.ys[j];const dir=s.side==="r"?1:-1;sx=s.x+dir*58;sy=s.y;ex=tx-dir*s.w/2;ey=ty;const m=(sx+ex)/2;d=`M${sx} ${sy}C${m} ${sy} ${m} ${ey} ${ex} ${ey}`}
  paths+=`<path class="tw" style="--rope:${s.c}" d="${d}"/><path class="tether" d="${d}"/>`;dots+=`<circle class="dot" cx="${ex}" cy="${ey}" r="8" fill="${s.c}"/>`;
  const b=document.createElement("div");b.className="t glass";b.style.cssText=`left:${tx}px;top:${ty}px;width:${s.w}px;--c:${s.c};--tx:${s.tx};--d:${-j*1.3}s${s.side==="d"?";--ty:0":""}`;b.textContent=t;board.appendChild(b);
 });
 const d=document.createElement("div");d.className="sec";d.style.cssText=`left:${s.x}px;top:${s.y}px;--c:${s.c};--tx:${s.tx};--d:${i*-.7}s`;
 d.innerHTML=shell(s.n)+`<div class="name glass ${s.lab}">${s.t}</div>`;board.appendChild(d);
});
svg.innerHTML=paths+dots;
for(let i=0;i<16;i++){const b=document.createElement("i"),z=8+Math.random()*20;b.className="bub";
 b.style.cssText=`left:${Math.random()*1700}px;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*16}s`;board.insertBefore(b,svg)}
/* масштаб і переміщення */
const vp=document.getElementById("vp");let k=1,x=0,y=0,fitK=1;
const apply=()=>board.style.transform=`translate(${x}px,${y}px) scale(${k})`;
function fit(){const w=vp.clientWidth,h=vp.clientHeight;fitK=Math.min(w/1700,h/986);k=fitK;x=(w-1700*k)/2;y=(h-986*k)/2;apply()}
function zoom(f,cx,cy){const nk=Math.min(Math.max(k*f,fitK*.9),fitK*5);f=nk/k;x=cx-(cx-x)*f;y=cy-(cy-y)*f;k=nk;apply()}
fit();addEventListener("resize",fit);
vp.addEventListener("wheel",e=>{e.preventDefault();zoom(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
const P=new Map();let last=0;
vp.addEventListener("pointerdown",e=>{P.set(e.pointerId,[e.clientX,e.clientY]);vp.classList.add("drag");vp.setPointerCapture(e.pointerId);last=0});
vp.addEventListener("pointermove",e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size===1){x+=e.clientX-o[0];y+=e.clientY-o[1];apply()}
 else if(P.size===2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(last)zoom(d/last,(a[0]+b[0])/2,(a[1]+b[1])/2);last=d}});
const up=e=>{P.delete(e.pointerId);last=0;if(!P.size)vp.classList.remove("drag")};
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
const c=()=>[vp.clientWidth/2,vp.clientHeight/2];
zi.onclick=()=>zoom(1.3,...c());zo.onclick=()=>zoom(1/1.3,...c());zf.onclick=fit;
