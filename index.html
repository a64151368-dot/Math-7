/* sun glow */
.glow{position:absolute;left:610px;top:60px;width:700px;height:640px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,248,210,.55) 0%,rgba(255,226,150,.22) 38%,rgba(255,210,120,0) 66%);
  mix-blend-mode:screen;animation:breathe 7s ease-in-out infinite;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
/* title */
h1{position:absolute;left:0;right:0;top:36px;margin:0;text-align:center;font-family:Rubik,sans-serif;font-weight:900;line-height:1;white-space:nowrap;letter-spacing:2px}
h1 .w{display:inline-block;font-size:150px}
h1 .n{display:inline-block;font-size:178px;margin-left:34px}
h1 .ch{display:inline-block;opacity:0;animation:drop .9s cubic-bezier(.3,1.6,.5,1) forwards,bob 5s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 1s)}
@keyframes drop{0%{opacity:0;transform:translateY(-140px) rotate(-12deg)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -7px}}
/* HUD */
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.ttl{position:absolute;left:50%;top:max(10px,2.5vh);transform:translateX(-50%);width:min(82vw,150vh);margin:0;animation:ttlin 1.4s cubic-bezier(.3,1.5,.5,1) both}
.ttl svg{display:block;width:100%;height:auto;overflow:visible;animation:ttlbob 6s ease-in-out 1.4s infinite}
@keyframes ttlin{0%{opacity:0;transform:translate(-50%,-60px) scale(.85)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes ttlbob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.6deg)}}
.cwrap{position:absolute;right:1.5vw;bottom:0;width:420px;height:420px;transform-origin:100% 100%;pointer-events:auto}
.cwrap .compass{left:60px;top:40px}
/* floating light symbols */
.sym{position:absolute;font-family:Rubik,sans-serif;font-weight:900;color:#fffdf4;opacity:.88;
  text-shadow:0 0 14px rgba(255,214,140,.95),0 0 36px rgba(255,190,90,.6),0 4px 0 rgba(214,140,60,.45);animation:float 9s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(14px,-18px) rotate(5deg)}}
/* gulls */
.gulls{position:absolute;left:1200px;top:300px;animation:glide 26s ease-in-out infinite;pointer-events:none}
@keyframes glide{0%,100%{transform:translate(0,0)}50%{transform:translate(-160px,30px)}}
.gull{position:absolute;animation:flap 1.1s ease-in-out infinite;transform-origin:50% 60%}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
/* sparkles */
.spk{position:absolute;width:26px;height:26px;animation:tw 3.2s ease-in-out infinite;opacity:0;pointer-events:none}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
/* compass */
.compass{display:block;text-decoration:none;position:absolute;left:1490px;top:680px;width:300px;height:380px;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.compass:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:30px}
.cbody{position:absolute;left:35px;top:-30px;width:230px;height:253px;animation:float2 4.5s ease-in-out infinite;transition:filter .3s}
@keyframes float2{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.compass:hover .cbody,.compass:focus-visible .cbody{filter:drop-shadow(0 0 22px rgba(255,236,170,.95)) drop-shadow(0 0 6px rgba(255,255,255,.9))}
.needle{transform-box:view-box;transform-origin:100px 120px;animation:seek 6s ease-in-out infinite}
@keyframes seek{0%,100%{transform:rotate(-22deg)}30%{transform:rotate(14deg)}55%{transform:rotate(-8deg)}75%{transform:rotate(26deg)}}
.compass:hover .needle{animation:whirl 1.4s cubic-bezier(.25,1.4,.4,1) forwards}
@keyframes whirl{from{transform:rotate(0)}to{transform:rotate(675deg)}}
.halo{position:absolute;left:49px;top:-2px;width:202px;height:202px;border-radius:50%;border:3px solid rgba(255,248,220,.85);animation:halo 2.6s ease-out infinite;pointer-events:none}
.halo.b{animation-delay:1.3s}
@keyframes halo{0%{transform:scale(.95);opacity:.8}100%{transform:scale(1.45);opacity:0}}
.ripples{position:absolute;left:0;top:200px;width:300px;height:70px;pointer-events:none}
.ripples ellipse{transform-box:fill-box;transform-origin:center;animation:rip 3.6s ease-out infinite}
.ripples ellipse:nth-child(2){animation-delay:1.2s}.ripples ellipse:nth-child(3){animation-delay:2.4s}
@keyframes rip{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1.15);opacity:0}}
.label{position:absolute;left:-40px;top:245px;width:380px;height:140px;pointer-events:none;overflow:visible}
.compass:hover .label .main{fill-opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1}}

/* Вікно маршруту: карти відкриваються поверх головної сторінки */
.route-modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:clamp(8px,2vw,24px);background:rgba(5,35,48,.78);backdrop-filter:blur(8px)}
.route-modal.is-open{display:flex}
.route-panel{width:min(96vw,1700px);height:min(94vh,1050px);display:flex;flex-direction:column;overflow:hidden;border:3px solid rgba(255,238,190,.9);border-radius:24px;background:#f8edcf;box-shadow:0 28px 90px rgba(0,0,0,.48)}
.route-toolbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,#fff4d2,#e9c58a);border-bottom:2px solid #b8874c}
.route-caption{margin-right:auto;color:#563719;font:900 clamp(15px,2vw,21px) Rubik, sans-serif}
.route-switch{border:2px solid #805323;border-radius:999px;padding:8px 18px;background:#fff8e8;color:#563719;font:900 15px Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 #805323;transition:transform .15s,background .15s,color .15s}
.route-switch:hover{transform:translateY(-1px)}
.route-switch[aria-pressed="true"]{background:#155a70;color:#fff;border-color:#0b3b4f;box-shadow:0 3px 0 #0b3b4f}
.route-close{width:40px;height:40px;flex:none;border:2px solid #805323;border-radius:50%;background:#b84d35;color:white;font:900 23px/1 Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 0 #71301f}
.route-frame{display:block;flex:1;width:100%;min-height:0;border:0;background:#0a4a68}
@media(max-width:600px){.route-modal{padding:0}.route-panel{width:100vw;height:100dvh;border:0;border-radius:0}.route-toolbar{gap:7px;padding:9px}.route-caption{font-size:14px}.route-switch{padding:8px 11px;font-size:13px}.route-close{width:36px;height:36px}}

</style>

<div class="route-modal" id="routeModal" aria-hidden="true">
  <section class="route-panel" role="dialog" aria-modal="true" aria-label="Карти навчального маршруту">
    <div class="route-toolbar">
      <div class="route-caption">Оберіть навчальний маршрут</div>
      <button class="route-switch" type="button" data-map="6" aria-pressed="true">6 клас</button>
      <button class="route-switch" type="button" data-map="7" aria-pressed="false">7 клас</button>
      <button class="route-close" id="closeRoute" type="button" aria-label="Закрити карти">×</button>
    </div>
    <iframe class="route-frame" id="routeFrame" title="Карта навчального маршруту"></iframe>
  </section>
</div>

<script>
/* fit stage */
function fit(){const s=Math.max(innerWidth/1920,innerHeight/1080),e=document.getElementById('stage');
  e.style.transform='scale('+s+')';e.style.left=(innerWidth-1920*s)/2+'px';e.style.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();
function fitHud(){const s=Math.min(innerWidth/1920,innerHeight/1080),c=document.getElementById('cwrap');c.style.transform='scale('+Math.max(s,0.42)+')'}
/* title extrusion */
(function(){const g=document.getElementById('ext');let h='';for(let i=12;i>=1;i--){h+=`<text x="${750+i*0.9}" y="${200+i*1.3}" stroke="#5a2a0a" stroke-width="14" stroke-linejoin="round" paint-order="stroke" fill="#b4561a">Математика <tspan fill="#2f6d1a" stroke="#1f420c">#7</tspan></text>`}g.innerHTML=h})();
fitHud();addEventListener('resize',fitHud);
/* sparkles on water */
const SP=[[420,800],[760,905],[1130,850],[1320,980],[300,960],[980,1010],[1880,860],[620,760]];
const sp=document.getElementById('spk');SP.forEach(([x,y],i)=>{sp.insertAdjacentHTML('beforeend',`<svg class="spk" style="left:${x}px;top:${y}px;animation-delay:${-i*0.7}s" viewBox="0 0 26 26"><path d="M13 0 L15 11 L26 13 L15 15 L13 26 L11 15 L0 13 L11 11Z" fill="#fffbe8"/></svg>`)});
/* compass ticks */
const tk=document.getElementById('ticks');for(let i=0;i<32;i++){const a=i*Math.PI/16,l=i%4===0?10:5,r1=70,r2=r1-l;
  tk.insertAdjacentHTML('beforeend',`<line x1="${100+r1*Math.sin(a)}" y1="${120-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${120-r2*Math.cos(a)}" stroke-width="${i%4===0?2.5:1.5}"/>`)}

/* Перемикання карт 6 і 7 класів у вікні «Наш маршрут» */
(function(){
  const modal=document.getElementById('routeModal');
  const frame=document.getElementById('routeFrame');
  const openBtn=document.getElementById('openBtn');
  const closeBtn=document.getElementById('closeRoute');
  const switches=[...document.querySelectorAll('.route-switch')];
  let previousFocus=null;
  function selectMap(grade){
    const file=grade==='7'?'karta.html':'karta6.html';
    switches.forEach(btn=>btn.setAttribute('aria-pressed',btn.dataset.map===grade?'true':'false'));
    if(frame.getAttribute('src')!==file) frame.src=file;
  }
  function openRoutes(event){
    if(event)event.preventDefault();
    previousFocus=document.activeElement;
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    selectMap('6');
    closeBtn.focus();
  }
  function closeRoutes(){
    modal.classList.remove('is-open');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
    if(previousFocus)previousFocus.focus();
  }
  openBtn.addEventListener('click',openRoutes);
  closeBtn.addEventListener('click',closeRoutes);
  switches.forEach(btn=>btn.addEventListener('click',()=>selectMap(btn.dataset.map)));
  modal.addEventListener('click',e=>{if(e.target===modal)closeRoutes()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&modal.classList.contains('is-open'))closeRoutes();
  });
  /* Кнопка повернення з карти має повертати на головну, а не відкривати її всередині iframe. */
  frame.addEventListener('load',()=>{
    try{
      const home=frame.contentDocument.querySelector('.home');
      if(home)home.target='_top';
    }catch(e){}
  });
})();

</script>
