<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Математика 7. Наш маршрут</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Caveat:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
:root{
  --sun-1:#FFF4D2; --sun-2:#FFDDB0; --grid:rgba(200,110,30,.10); --grid-b:rgba(200,110,30,.18);
  --ink:#3A2142; --muted:#7A5A66; --card:#FFFCF5; --line:#F0D6B8;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --pen:"Marck Script","Caveat","Segoe Script",cursive;
  --round:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{color:var(--ink);font-family:var(--round);font-weight:600;
  background:linear-gradient(var(--grid-b) 1px,transparent 1px) 0 0/100px 100px,linear-gradient(90deg,var(--grid-b) 1px,transparent 1px) 0 0/100px 100px,linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/20px 20px,radial-gradient(1000px 700px at 50% 45%,#FFF8E2 0%,transparent 70%),linear-gradient(160deg,var(--sun-1) 0%,var(--sun-2) 100%)}
h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #E0503B;outline-offset:3px;border-radius:8px}

#vp{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#vp.drag{cursor:grabbing}
#board{position:absolute;left:0;top:0;width:2400px;height:1500px;transform-origin:0 0}
#links{position:absolute;inset:0;width:2400px;height:1500px;overflow:visible;pointer-events:none}
.branch{fill:none;stroke-linecap:round;opacity:.7}
.branch-dash{fill:none;stroke:#FFFCF5;stroke-width:2.5;stroke-dasharray:2 12;stroke-linecap:round;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.rn circle{stroke:#FFFCF5;stroke-width:4}
.rn text{font-family:var(--round);font-weight:900;font-size:17px;fill:#fff;text-anchor:middle}

/* центр */
.core{position:absolute;left:800px;top:540px;width:800px;height:420px;display:grid;place-items:center;align-content:center;gap:0;text-align:center;pointer-events:none}
.core .kicker{font-family:var(--hand);font-size:40px;font-weight:700;color:var(--muted);line-height:1}
.core .big{font-family:var(--round);font-weight:900;font-size:104px;line-height:.95;letter-spacing:-.01em;color:#F2A65A;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:6px 7px 0 var(--ink)}
.core .row{display:flex;align-items:center;gap:18px;margin-top:10px}
.core .seven{width:104px;height:104px;border-radius:50%;background:var(--ink);color:#FFF4D2;display:grid;place-items:center;font-size:66px;font-weight:900;transform:rotate(-8deg);box-shadow:0 0 0 6px #FFFCF5,0 0 0 9px var(--ink)}
.core .oval{padding:14px 40px 18px;border-radius:50%;background:#F7C98B;border:3px solid var(--ink);font-family:var(--pen);font-size:52px;line-height:1;transform:rotate(-4deg);box-shadow:0 12px 20px -14px rgba(80,30,10,.6)}
.core .meta{margin-top:16px;font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

/* розділ */
.sec{position:absolute;width:640px;display:grid;gap:6px}
.sec .top{display:flex;align-items:flex-end;gap:14px}
.sec .tt{flex:1;min-width:0}
.sec .tag{display:flex;gap:8px;align-items:center;font-family:var(--hand);font-size:23px;font-weight:700;color:var(--muted);line-height:1}
.sec .tag i{font-style:normal;font-family:var(--round);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:2px solid currentColor}
.sec .tag i.alg{color:#7550E3}.sec .tag i.geo{color:#0C9483}
.sec h2{font-family:var(--pen);font-weight:400;font-size:48px;text-wrap:balance;line-height:1.05;color:var(--c);cursor:pointer}
.sec h2 b{font-family:var(--round);font-weight:900;font-size:30px;margin-right:10px;vertical-align:6px}
.sec .rule{height:4px;border-radius:4px;background:var(--c);opacity:.85;margin-top:2px;transform:rotate(-.4deg)}
.sec .desc{font-size:17px;line-height:1.4;font-weight:700;color:var(--ink);padding:8px 12px;border-radius:12px;background:var(--tint);border-left:5px solid var(--c)}
.sec .desc b{font-family:var(--hand);font-size:21px;color:var(--c);margin-right:4px}
.sec ol{list-style:none;margin:2px 0 0;padding:0;display:grid}
.sec li button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:5px 4px;border-bottom:2px solid var(--line);cursor:pointer;text-align:left;font-family:var(--hand);font-size:27px;font-weight:700;line-height:1.1;color:var(--ink)}
.sec li button:hover{background:rgba(255,255,255,.55)}
.sec li i{flex:none;font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--round);font-size:13px;font-weight:900}
.sec li .star{margin-left:auto;color:#E8A700;font-size:24px}
.pic{flex:none;position:relative;width:176px;height:122px;border-radius:50%;border:3px dashed var(--c);background:linear-gradient(180deg,#FFFCF5 0%,#FFF6E2 66%,#BFE6E1 66%,#8FD0CB 100%);display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 18px -14px rgba(80,30,10,.6)}
.pic svg{width:176px;height:122px}
.pic .wv{animation:wv 4s linear infinite}
@keyframes wv{to{transform:translateX(-24px)}}
.pic .palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-5deg)}}
.pic text{font-family:var(--round);font-weight:900}

/* фініш */
.fin{position:absolute;width:600px;display:grid;gap:10px}
.fin h2{justify-self:start}
.fin .stats{display:flex;gap:10px}
.fin .stats div{flex:1;background:#FFFCF5;border:2px dashed var(--line);border-radius:16px;padding:8px 12px;text-align:center}
.fin .stats b{display:block;font-size:34px;font-weight:900;line-height:1.05}
.fin .stats span{font-family:var(--hand);font-size:20px;font-weight:700;color:var(--muted)}
.fin p{font-family:var(--hand);font-size:25px;font-weight:700;line-height:1.15}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:800;color:var(--muted);align-items:center}
.legend i{font-style:normal;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:2px solid currentColor}
.badge{position:absolute;display:inline-flex;align-items:center;gap:12px;padding:8px 26px 10px 14px;border-radius:22px;border:4px solid #5A2E14;font-family:"Rubik","Nunito",sans-serif;font-weight:900;font-size:42px;letter-spacing:.06em;line-height:1;text-transform:uppercase;box-shadow:0 7px 0 #5A2E14,0 14px 26px -10px rgba(90,46,20,.55);animation:glowb 2.4s ease-in-out infinite}
.badge svg{flex:none}
.badge.start{color:#fff;background:linear-gradient(180deg,#FF8A5C,#E0503B);transform:rotate(-4deg);text-shadow:0 3px 0 #9A2E1E}
.badge.finish{position:relative;color:#5A2E14;background:linear-gradient(180deg,#FFE27A,#F2A62A);transform:rotate(-3deg);text-shadow:0 2px 0 #FFF4C8}
@keyframes glowb{50%{box-shadow:0 7px 0 #5A2E14,0 0 0 10px rgba(255,210,90,.35),0 14px 26px -10px rgba(90,46,20,.55)}}
.big-arrow{fill:none;stroke-linecap:round;stroke-linejoin:round}
.arrow-move{animation:nudgea 1.6s ease-in-out infinite}
@keyframes nudgea{50%{transform:translate(var(--dx),var(--dy))}}
.doodle{position:absolute;font-family:var(--hand);font-size:30px;font-weight:700;color:var(--muted);opacity:.4;pointer-events:none}

/* керування */
.ctrl{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(46px,calc(env(safe-area-inset-bottom,0px) + 46px));display:grid;gap:10px;z-index:5}
.ctrl button{width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:#F7C98B;font-size:26px;font-weight:900;cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 0 var(--ink)}
.ctrl button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.hint{position:fixed;right:16px;background:rgba(255,252,245,.85);padding:2px 12px;border-radius:999px;bottom:max(10px,env(safe-area-inset-bottom,0px));font-family:var(--hand);font-size:19px;font-weight:700;color:var(--muted);z-index:5;pointer-events:none}

/* картка теми */
dialog{border:0;padding:0;border-radius:24px;background:var(--card);color:var(--ink);width:min(700px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 60px -20px rgba(80,30,10,.55);border-top:8px solid var(--accent,var(--ink))}
dialog::backdrop{background:rgba(70,30,20,.55)}
.dl{display:grid;gap:14px;padding:16px clamp(14px,3vw,24px) 20px}
.d-head{display:flex;align-items:flex-start;gap:14px}
.d-sym{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;color:#fff;background:var(--accent,var(--ink));transform:rotate(-6deg)}
.d-title{display:grid;gap:2px;min-width:0;flex:1}
.d-sec{font-family:var(--hand);font-size:22px;font-weight:700;line-height:1.1;color:var(--accent,var(--ink))}
.d-title h2{font-size:clamp(20px,3vw,26px);font-weight:900;line-height:1.15;text-wrap:balance}
.d-step{font-size:13px;font-weight:800;color:var(--muted)}
.x{flex:none;border:0;background:var(--ink);color:var(--card);width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:900;cursor:pointer}
.more{display:grid;gap:10px;padding:14px 16px;border-radius:16px;background:#FFF3DE}
.more h3{font-family:var(--hand);font-size:26px;font-weight:700;line-height:1.1;color:var(--accent,var(--ink))}
.more ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.more li{position:relative;padding-left:22px;font-size:15.5px;line-height:1.5}
.more li::before{content:"★";position:absolute;left:0;top:0;font-size:13px;color:var(--accent,var(--ink))}
.formula{font-size:clamp(18px,2.6vw,22px);font-weight:800;line-height:1.4;padding:12px 16px;border-radius:14px;border:2px dashed var(--accent,var(--ink));background:#fff;text-align:center}
.formula b{display:block;font-family:var(--hand);font-size:22px;font-weight:700;color:var(--accent,var(--ink))}
.d-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent,var(--ink))}
.btn:disabled{opacity:.35;cursor:default}
.d-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.d-list button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:#FFF3DE;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:15.5px;font-weight:700;line-height:1.35}
.d-list button:hover{background:#FFE9C4}
.d-list i{flex:none;font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:900}

/* морські деталі */
.rose{position:absolute;left:880px;top:430px;width:640px;height:640px;opacity:.14;pointer-events:none}
.rose .spin{animation:spinr 90s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.deco{position:absolute;pointer-events:none;overflow:visible}
.deco.ship .rock{transform-box:fill-box;transform-origin:50% 90%;animation:rock 3s ease-in-out infinite}
@keyframes rock{25%{transform:rotate(5deg)}75%{transform:rotate(-5deg)}}
.deco.ship{animation:sail 14s ease-in-out infinite}
@keyframes sail{50%{transform:translateX(40px)}}
.deco.bottle{animation:bobb 5s ease-in-out infinite}
@keyframes bobb{50%{transform:translateY(-10px) rotate(8deg)}}
.deco.gulls path{animation:flapg 2.6s ease-in-out infinite}
@keyframes flapg{50%{transform:translateY(-6px) scaleY(.7)}}
.seaband{position:absolute;left:0;top:1505px;width:2400px;height:60px;pointer-events:none;overflow:hidden;opacity:.55}
.seaband svg{width:2600px;height:60px;animation:wv2 12s linear infinite}
@keyframes wv2{to{transform:translateX(-200px)}}
.badge.finish svg{width:40px;height:54px}

.deco.chest .glint{animation:twk 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes twk{50%{opacity:.2;transform:scale(.5)}}
.deco.chest .lid{transform-box:fill-box;transform-origin:50% 100%;animation:lid 4s ease-in-out infinite}
@keyframes lid{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-10deg)}}
.deco.parrot .head{transform-box:fill-box;transform-origin:50% 90%;animation:nod 2.4s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(-12deg)}}
.deco.parrot .tail{transform-box:fill-box;transform-origin:50% 0;animation:sway2 3s ease-in-out infinite}
@keyframes sway2{50%{transform:rotate(6deg)}}
.deco.pirate .scope{transform-box:fill-box;transform-origin:0 100%;animation:scope 5s ease-in-out infinite}
@keyframes scope{50%{transform:rotate(-8deg)}}
.deco .lbl{font-family:var(--hand);font-weight:700;font-size:24px;fill:#C27100}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="vp">
  <div id="board">
    <svg id="links" viewBox="0 0 2400 1500"></svg>
    <svg class="rose" viewBox="-200 -200 400 400" aria-hidden="true"><g class="spin"><circle r="190" fill="none" stroke="#C27100" stroke-width="3" stroke-dasharray="2 10"/><circle r="150" fill="none" stroke="#C27100" stroke-width="2"/><path d="M0 -195 L22 -22 L0 0 L-22 -22Z M0 195 L22 22 L0 0 L-22 22Z M-195 0 L-22 -22 L0 0 L-22 22Z M195 0 L22 -22 L0 0 L22 22Z" fill="#F2A65A" stroke="#7A4515" stroke-width="3" stroke-linejoin="round"/><path d="M0 -120 L12 -12 L0 0Z M120 0 L12 12 L0 0Z M0 120 L-12 12 L0 0Z M-120 0 L-12 -12 L0 0Z" fill="#7A4515" transform="rotate(45)"/></g></svg>
    <div class="core" aria-hidden="true">
      <div class="big">МАТЕМАТИКА</div>
      <div class="row"><div class="seven">7</div><div class="oval">наш маршрут</div></div>
    </div>
    <div id="secs"></div>
  </div>
</div>
<div class="ctrl">
  <button id="zin" type="button" aria-label="Наблизити">+</button>
  <button id="zout" type="button" aria-label="Віддалити">−</button>
  <button id="zfit" type="button" aria-label="Показати всю карту">↺</button>
</div>
<div class="hint">коліщатко чи +/− — масштаб · тягни — посунути · натисни тему — картка</div>

<dialog id="dlg" aria-labelledby="dTitle">
  <div class="dl">
    <div class="d-head">
      <div class="d-sym" id="dNum">1</div>
      <div class="d-title"><span class="d-sec" id="dSec"></span><h2 id="dTitle"></h2><span class="d-step" id="dStep"></span></div>
      <button class="x" id="dClose" type="button" aria-label="Закрити">×</button>
    </div>
    <div id="dBody" style="display:grid;gap:14px"></div>
    <div class="d-foot">
      <button class="btn" id="dPrev" type="button">← Попередня</button>
      <button class="btn" id="dNext" type="button">Наступна →</button>
    </div>
  </div>
</dialog>

<script>
const ST=[
 [0,"Точка, пряма, промінь та відрізок","Точка, пряма,\nпромінь, відрізок",["Через дві точки проходить лише одна пряма.","Промінь має початок, але не має кінця; відрізок має два кінці.","Якщо точка C лежить між A і B, довжини відрізків додаються."],"AB = AC + CB"],
 [0,"Кут та його властивості. Вимірювання кутів. Бісектриса кута","Кут. Вимірювання.\nБісектриса",["Кути вимірюють транспортиром у градусах.","Гострий < 90°, прямий = 90°, тупий > 90°, розгорнутий = 180°.","Бісектриса — промінь, що ділить кут навпіл."],"∠AOC = ∠COB = ½ ∠AOB"],
 [1,"Вирази зі змінними. Цілі раціональні вирази","Вирази\nзі змінними",["Вираз зі змінними має значення, коли підставити числа замість букв.","Цілий вираз не містить ділення на вираз зі змінною.","Приклади: 2a + 3b, x² − 1, (m + n) : 5."],"2a + 3b при a = 1, b = 2 → 8"],
 [1,"Тотожність. Тотожні перетворення виразу","Тотожність.\nПеретворення",["Тотожність — рівність, правильна при будь-яких значеннях змінних.","Тотожні перетворення: розкриття дужок, зведення подібних доданків.","Щоб довести тотожність, перетворюють одну частину до вигляду іншої."],"a(b + c) = ab + ac"],
 [2,"Степінь з натуральним показником","Степінь",["aⁿ — добуток n множників, кожен з яких дорівнює a.","a — основа, n — показник; a¹ = a.","Від'ємне число в парному степені — додатне, у непарному — від'ємне."],"2⁵ = 2·2·2·2·2 = 32"],
 [2,"Властивості степеня з натуральним показником","Властивості\nстепеня",["При множенні степенів з однаковою основою показники додають.","При діленні — віднімають; при піднесенні степеня до степеня — множать.","Степінь добутку дорівнює добутку степенів."],"aᵐ·aⁿ = aᵐ⁺ⁿ · (aᵐ)ⁿ = aᵐⁿ · (ab)ⁿ = aⁿbⁿ"],
 [3,"Суміжні та вертикальні кути, їхні властивості","Суміжні та\nвертикальні кути",["Суміжні кути мають спільну сторону, а дві інші утворюють пряму.","Сума суміжних кутів дорівнює 180°.","Вертикальні кути рівні."],"∠1 + ∠2 = 180° · ∠1 = ∠3"],
 [3,"Паралельні та перпендикулярні прямі. Перпендикуляр. Відстань від точки до прямої","Паралельні й\nперпендикулярні",["Паралельні прямі лежать в одній площині й не перетинаються.","Перпендикулярні прямі перетинаються під прямим кутом.","Відстань від точки до прямої — довжина перпендикуляра до неї."],"a ∥ b · a ⊥ c"],
 [3,"Кути, утворені при перетині двох прямих січною. Ознаки паралельності прямих","Січна. Ознаки\nпаралельності",["Січна утворює відповідні, внутрішні різносторонні та односторонні кути.","Прямі паралельні, якщо відповідні або різносторонні кути рівні.","…або якщо сума односторонніх кутів дорівнює 180°."],"∠1 + ∠2 = 180° ⇒ a ∥ b"],

const band=document.createElement("div");band.className="seaband";
let wd="";for(let x=0;x<2600;x+=100){wd+=`M${x} 30 q25 -16 50 0 t50 0 `}
band.innerHTML=`<svg viewBox="0 0 2600 60" preserveAspectRatio="none"><path d="${wd} V60 H0Z" fill="#BFE6E1"/><path d="${wd}" fill="none" stroke="#5DB8C8" stroke-width="3"/></svg>`;
document.getElementById("board").appendChild(band);


/* короткі гілки від центру (фіксовані координати) */
const NS="http://www.w3.org/2000/svg",links=document.getElementById("links");
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const ARCS=[
 "M900 565 Q720 470 640 295",
 "M1200 555 Q1180 420 1200 285",
 "M1500 565 Q1680 470 1760 295",
 "M1610 700 Q1660 655 1700 655",
 "M1500 935 Q1640 1000 1750 975",
 "M1200 960 Q1215 1010 1200 1055",
 "M900 935 Q760 1000 650 975"
];
ARCS.forEach((d,si)=>mk("path",{d,class:"branch",stroke:SECS[si].c,"stroke-width":10},links));
mk("path",{d:"M790 750 Q720 745 690 690",class:"branch",stroke:"#C27100","stroke-width":8},links);
/* масивні стрілки */
function bigArrow(d,head,col,dx,dy){const g=mk("g",{class:"arrow-move"},links);g.style.setProperty("--dx",dx+"px");g.style.setProperty("--dy",dy+"px");
  mk("path",{d,class:"big-arrow",stroke:"#5A2E14","stroke-width":26},g);mk("path",{d:head,fill:"#5A2E14",stroke:"#5A2E14","stroke-width":10,"stroke-linejoin":"round"},g);
  mk("path",{d,class:"big-arrow",stroke:col,"stroke-width":14},g);mk("path",{d:head,fill:col,stroke:col,"stroke-width":2,"stroke-linejoin":"round"},g);}
bigArrow("M470 -20 C 400 -15, 350 10, 330 50","M306 40 L330 82 L352 44 Z","#E0503B",-6,8);
bigArrow("M245 960 C 290 880, 190 790, 235 700","M208 716 L238 672 L262 722 Z","#F2A62A",0,-8);

/* картки тем */
const $=id=>document.getElementById(id);
const dlg=$("dlg");let cur=0,mode="topic";
function fillTopic(i){mode="topic";cur=i;const s=ST[i],sec=SECS[s[0]];
  dlg.style.setProperty("--accent",sec.c);
  $("dNum").textContent=i+1;$("dSec").textContent=`${sec.r}. ${sec.n}`;$("dTitle").textContent=s[1];
  const inSec=ST.map((r,k)=>[r,k]).filter(([r])=>r[0]===s[0]).map(([,k])=>k);
  $("dStep").textContent=`Зупинка ${i+1} з ${N} · у розділі ${inSec.indexOf(i)+1} з ${inSec.length}`;
  $("dBody").innerHTML=`<div class="more"><h3>Головне на зупинці</h3><ul>${s[3].map(t=>`<li>${t}</li>`).join("")}</ul></div><div class="formula"><b>Запам'ятай</b>${s[4]}</div>`;
  $("dPrev").disabled=i===0;$("dNext").disabled=i===N-1;
  $("dPrev").textContent="← Попередня";$("dNext").textContent="Наступна →";
}
function fillSec(si){mode="sec";cur=si;const s=SECS[si];dlg.style.setProperty("--accent",s.c);
  const idx=ST.map((r,i)=>[r,i]).filter(([r])=>r[0]===si).map(([,i])=>i);
  $("dNum").textContent=s.r;$("dSec").textContent=`${s.place} · ${s.k==="alg"?"Алгебра":"Геометрія"}`;$("dTitle").textContent=s.n;
  $("dStep").textContent=`Розділ ${si+1} з 7 · ${idx.length} ${idx.length>4?"тем":"теми"}`;
  $("dBody").innerHTML=`<div class="more"><h3>Про що цей розділ</h3><p style="font-size:16px;line-height:1.5">${s.d}</p></div><ul class="d-list">${idx.map(i=>`<li><button type="button" data-i="${i}"><i>${i+1}</i>${ST[i][1]}</button></li>`).join("")}</ul>`;
  $("dPrev").disabled=si===0;$("dNext").disabled=si===6;
  $("dPrev").textContent="← Попередній розділ";$("dNext").textContent="Наступний розділ →";
}
const show=()=>{if(!dlg.open)dlg.showModal()};
$("dPrev").onclick=()=>mode==="topic"?cur>0&&fillTopic(cur-1):cur>0&&fillSec(cur-1);
$("dNext").onclick=()=>mode==="topic"?cur<N-1&&fillTopic(cur+1):cur<6&&fillSec(cur+1);
$("dClose").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close();const b=e.target.closest(".d-list button");if(b)fillTopic(+b.dataset.i)});
document.addEventListener("keydown",e=>{if(!dlg.open)return;if(e.key==="ArrowRight")$("dNext").click();if(e.key==="ArrowLeft")$("dPrev").click()});

/* масштаб і переміщення */
const vp=$("vp"),board=$("board");let sc=1,tx=0,ty=0;
const apply=()=>board.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;
function fit(){const w=vp.clientWidth,h=vp.clientHeight;sc=Math.min(w/2400,h/1580)*0.98;tx=(w-2400*sc)/2;ty=(h-1580*sc)/2+80*sc;apply()}
function zoomAt(f,px,py){const ns=Math.max(.2,Math.min(4,sc*f));tx=px-(px-tx)*ns/sc;ty=py-(py-ty)*ns/sc;sc=ns;apply()}
vp.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX,e.clientY)},{passive:false});
const ptrs=new Map();let moved=0,pinch=null;
vp.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)}}});
vp.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);if(moved>6){vp.classList.add("drag");try{vp.setPointerCapture(e.pointerId)}catch(_){}}tx+=dx;ty+=dy;apply()}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt(d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2);pinch.d=d;moved=99}});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size)vp.classList.remove("drag")};
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("click",e=>{if(moved>6)return;
  const b=e.target.closest("li button[data-i]");if(b){fillTopic(+b.dataset.i);show();return}
  const h=e.target.closest("h2[data-sec]");if(h){fillSec(+h.dataset.sec);show()}},true);
vp.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest("h2[data-sec]");if(h&&(e.key==="Enter"||e.key===" ")){e.preventDefault();fillSec(+h.dataset.sec);show()}});
$("zin").onclick=()=>zoomAt(1.25,vp.clientWidth/2,vp.clientHeight/2);
$("zout").onclick=()=>zoomAt(1/1.25,vp.clientWidth/2,vp.clientHeight/2);
$("zfit").onclick=fit;
window.addEventListener("resize",fit);fit();
</script>
